; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_matrixportal_esp32s3]
platform = espressif32
board = adafruit_matrixportal_esp32s3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_flags =
  -D CONFIG_ASYNC_TCP_QUEUE_SIZE=64
  -D CONFIG_ASYNC_TCP_STACK_SIZE=24576
  -D FIRMWARE_VERSION=\"0.2.7\"
  -D FIRMWARE_OTA_URL_DEFAULT=\"https://github.com/gztproject/MatrixPortal/releases/latest/download/\"
; Optional: -DMATRIXSIGN_AP_PASSWORD=\"your-long-ap-password\"
lib_deps = 
  mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ ^3.0.15
  adafruit/Adafruit GFX Library @ ^1.12.6
  tzapu/WiFiManager @ ^2.0.17
  ESP32Async/ESPAsyncWebServer @ ^3.6.0
  ESP32Async/AsyncTCP @ ^3.3.2
  bblanchon/ArduinoJson @ ^7.3.0
  bitbank2/AnimatedGIF @ ^2.1.1
